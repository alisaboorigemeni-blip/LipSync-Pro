    <title>LipSync Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
          --bg: #000000;
          --ink: #ffffff;
          --accent: #007AFF;
          --surface: rgba(255, 255, 255, 0.05);
          --glass-border: rgba(255, 255, 255, 0.1);
          --glass-blur: blur(20px);
          color-scheme: dark;
      }
      body { 
        font-family: 'Geist', sans-serif; 
        background-color: var(--bg); 
        color: var(--ink); 
        background-image: 
            radial-gradient(circle at 20% 20%, rgba(0, 122, 255, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 80% 80%, rgba(94, 92, 230, 0.15) 0%, transparent 40%);
        background-attachment: fixed;
      }
      .font-mono { font-family: 'Geist Mono', monospace; }
      ::selection { background: var(--accent); color: var(--ink); }
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
